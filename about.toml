# Prefer MIT when a crate offers a choice, retaining its actual copyright text.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Unlicense", "BSL-1.0", "OpenSSL", "MPL-2.0", "0BSD", "CDLA-Permissive-2.0", "Pixar"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Keep build/dev dependencies too: proc macros and generators can embed code.
ignore-build-dependencies = false
ignore-dev-dependencies = false
workarounds = ["ring"]
