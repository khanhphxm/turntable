[changelog]
body = """
## {{ version | trim_start_matches(pat="v") }}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/khanhphxm/turntable/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci)", group = "Build and CI" },
  { message = "^revert", group = "Reverts" },
  { message = "^(chore|style)", group = "Maintenance" },
  { message = ".*", group = "Other changes" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+'
use_branch_tags = true
topo_order = true
sort_commits = "oldest"
