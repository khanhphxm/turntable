[workspace]
members = ["crates/turntable", "crates/turntable-core"]
exclude = ["vendor/gpui-pre-linux", "vendor/gpui-pre-wgpu"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/khanhphxm/turntable"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
block2 = { version = "0.6" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Bundle libdbus instead of requiring Linux development headers.
dbus = { version = "0.9", features = ["vendored"] }
dbus-crossroads = { version = "0.5" }
embed-resource = { version = "3.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gpui-kit = { version = "0.7.3" }
gpui-test = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }
http = { version = "1" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
libc = { version = "0.2" }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = { version = "0.8", default-features = false }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSImage", "std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDate"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSString", "NSValue", "block2", "std"] }
objc2-media-player = { version = "0.3", default-features = false, features = [
	"MPMediaItem",
	"MPNowPlayingInfoCenter",
	"MPRemoteCommand",
	"MPRemoteCommandCenter",
	"MPRemoteCommandEvent",
	"block2",
	"objc2-app-kit",
	"objc2-core-foundation",
	"std",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAAnimation", "CABase", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CATextLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
plist = { version = "1" }
parking_lot = { version = "0.12" }
protobuf = { version = "3.7" }
rand = { version = "0.10" }
raw-window-handle = { version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.11", default-features = false }
smallvec = { version = "1" }
smol = { version = "2" }
tempfile = { version = "3" }
thiserror = { version = "2" }
tikv-jemallocator = { version = "0.7" }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
turntable-core = { path = "crates/turntable-core" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows = { version = "0.62", default-features = false, features = ["std"] }
winreg = { version = "0.56" }
x11rb = { version = "0.14" }

# Curated additions to Clippy defaults: pedantic conflicts with exact DSP comparisons and intentional precision changes.
# Document genuine exceptions with local #[expect(..., reason = "...")]; never use blanket allows.

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Failures must be handled, not abort the player or disappear.
exit = "deny"
expect_used = "deny"
indexing_slicing = "warn"
let_underscore_future = "deny"
let_underscore_lock = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"

# Diagnostics and exemptions belong at explicit, documented sites.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
tests_outside_test_module = "deny"

# Unsafe operations require safety contracts and explicit pointer conversions.
borrow_as_ptr = "warn"
missing_safety_doc = "deny"
ptr_as_ptr = "warn"
ref_as_ptr = "warn"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

# Numeric conversions must preserve the intended range and rounding.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
manual_midpoint = "warn"

# Keep control flow, ownership and interfaces easy to follow.
cognitive_complexity = "warn"
enum_glob_use = "warn"
fn_params_excessive_bools = "warn"
ignored_unit_patterns = "warn"
items_after_statements = "warn"
manual_assert = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mut_mut = "warn"
needless_continue = "warn"
needless_pass_by_value = "warn"
redundant_else = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
wildcard_imports = "warn"

# Avoid redundant allocation, copying and iteration.
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
needless_for_each = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
stable_sort_primitive = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unreadable_literal = "warn"

# Optimize dependencies so debug desktop builds remain responsive.
[profile.dev.package."*"]
opt-level = 2

# CI tests: unoptimized dependencies build several times faster from scratch, and line tables
# keep backtraces readable at a fraction of full debug info's size.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
# Expose native-element paint context without changing GPUI drawing.
gpui-pre = { path = "vendor/gpui-pre" }
# Drop removed layout nodes' measurement contexts rather than retaining old page text.
taffy = { path = "vendor/taffy" }
# Park macOS display links when no window redraw or animation is pending.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# Park X11 refresh timers when no redraw or animation is pending.
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# Park Windows compositor waits until a window requests a frame.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# Right-size Metal atlas pages, instance buffers and path targets.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Apply the same compact atlas/buffer and lazy path-target policy to wgpu.
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Expose Spirc queue state and mutations to the in-process player.
librespot-connect = { path = "vendor/librespot-connect" }
# Report session attributes instead of exiting on non-Premium accounts.
librespot-core = { path = "vendor/librespot-core" }
# Use one decoder runtime worker rather than one per core.
librespot-playback = { path = "vendor/librespot-playback" }
# Stream CDN frames to disk with bounded backpressure instead of collecting whole ranges.
librespot-audio = { path = "vendor/librespot-audio" }
