<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a2a2a"/>
			<stop offset="1" stop-color="#0a0a0a"/>
		</linearGradient>
		<radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0.30" stop-color="#1a1a1a"/>
			<stop offset="1" stop-color="#050505"/>
		</radialGradient>
		<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.45" stop-color="#fff" stop-opacity="0.13"/>
			<stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
			<stop offset="0.75" stop-color="#fff" stop-opacity="0.06"/>
			<stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3be477"/>
			<stop offset="1" stop-color="#1db954"/>
		</linearGradient>
		<linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#f4f4f4"/>
			<stop offset="1" stop-color="#b8b8b8"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
		</filter>
		<clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
	</defs>

	<!-- Tile (macOS grid: 824 px body on a 1024 canvas). -->
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
	<rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>

	<g clip-path="url(#tile)">
		<!-- Record, a little left of centre to leave room for the arm. -->
		<g filter="url(#shadow)">
			<circle cx="512" cy="512" r="300" fill="url(#vinyl)"/>
		</g>
		<g fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="3">
			<circle cx="512" cy="512" r="296"/>
			<circle cx="512" cy="512" r="272"/>
			<circle cx="512" cy="512" r="248"/>
			<circle cx="512" cy="512" r="224"/>
			<circle cx="512" cy="512" r="200"/>
			<circle cx="512" cy="512" r="176"/>
			<circle cx="512" cy="512" r="152"/>
		</g>
		<circle cx="512" cy="512" r="300" fill="url(#sheen)"/>
		<!-- Label and spindle. -->
		<circle cx="512" cy="512" r="112" fill="url(#label)"/>
		<circle cx="512" cy="512" r="112" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="4"/>
		<circle cx="512" cy="512" r="15" fill="#0a0a0a"/>

		<!-- Tonearm: pivot top right, resting on the outer grooves. -->
		<g filter="url(#shadow)">
			<circle cx="812" cy="212" r="58" fill="#2e2e2e"/>
			<circle cx="812" cy="212" r="40" fill="url(#arm)"/>
			<path d="M812 212 L812 560 Q812 600 784 628 L728 684" fill="none" stroke="url(#arm)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
			<rect x="678" y="660" width="76" height="46" rx="10" transform="rotate(-45 716 683)" fill="url(#arm)"/>
		</g>
		<circle cx="812" cy="212" r="12" fill="#6a6a6a"/>
	</g>
</svg>
