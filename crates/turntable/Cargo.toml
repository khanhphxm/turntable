[package]
name = "turntable"
description = "Lightweight native Spotify player"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "0.7.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
smol = "2"
turntable-core = { path = "../turntable-core" }

# Enable only GPUI's Metal harness, not Kit's optional gpui-fast test backend.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["test-support"] }

# jemalloc hands freed pages back (the footprint follows what is in use, not the peak); not on
# Windows, where it doesn't build with MSVC.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSData", "NSDictionary", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
dbus-crossroads = "0.5"
libc = "0.2"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media", "Storage_Streams", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "3.0"
