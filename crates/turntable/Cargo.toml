[package]
description = "Lightweight native Spotify player"
edition.workspace = true
license.workspace = true
name = "turntable"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
gpui-kit.workspace = true
image.workspace = true
jpeg-decoder.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tray-icon.workspace = true
turntable-core.workspace = true

[dev-dependencies]
gpui-test.workspace = true
tempfile.workspace = true
turntable-core.workspace = true
turntable-core.features = ["test-support"]

[build-dependencies]
embed-resource.workspace = true

# Return freed pages to the OS; jemalloc is unavailable on Windows/MSVC.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus.workspace = true
dbus-crossroads.workspace = true
libc.workspace = true
tempfile.workspace = true
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-app-kit.features = ["NSView", "NSWindow"]
objc2-foundation.workspace = true
objc2-foundation.features = ["NSBundle"]
objc2-media-player.workspace = true
objc2-service-management.workspace = true
plist.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
winreg.workspace = true
windows.features = [
	"Foundation",
	"Media",
	"Storage_Streams",
	"Win32_System_Com",
	"Win32_System_WinRT",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
]

