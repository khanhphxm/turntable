[package]
description = "Host-neutral Spotify playback, audio and application state"
edition.workspace = true
license.workspace = true
name = "turntable-core"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Offline host/controller fixtures; never enabled by production builds.
test-support = []
# Offline decoder/DSP measurements; does not connect to Spotify or open an audio device.
audio-bench = ["dep:libc", "dep:symphonia", "librespot-playback/audio-bench"]

[dependencies]
futures-util.workspace = true
http.workspace = true
librespot-connect.workspace = true
librespot-core.workspace = true
librespot-metadata.workspace = true
librespot-playback.workspace = true
librespot-protocol.workspace = true
oauth2.workspace = true
parking_lot.workspace = true
protobuf.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
tempfile.workspace = true
thiserror.workspace = true
symphonia = { version = "0.5", default-features = false, optional = true }
tokio.workspace = true
ureq.workspace = true

[dev-dependencies]
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
windows.features = [
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
]

[[example]]
name = "audio-bench"
required-features = ["audio-bench"]
