[package]
name = "turntable-core"
description = "Host-neutral Spotify playback, audio and application state"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "turntable_core"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sha2 = { version = "0.10", default-features = false }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The library app's refresh token in the OS credential store: macOS Keychain, Linux Secret
# Service (blocking libdbus, no async runtime) or Windows Credential Manager.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", default-features = false, features = [
	"std",
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

