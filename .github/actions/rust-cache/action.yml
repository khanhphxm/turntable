name: Rust cache
description: >
  rust-cache keeps registry crates built in target/, but drops the vendored path crates (they sit
  inside the workspace) and Cargo would rebuild them anyway: path crates are checked by file
  modification time, and a fresh checkout makes every file new. So gpui, librespot and everything
  built on them recompiled on every run. sccache caches those rustc outputs by content instead.
  Its directory travels as one cache entry; sccache's per-object GitHub backend made a cold build
  take 20+ minutes.
inputs:
  key:
    description: Cache key; one per job and OS.
    required: true
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.key }}
        save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci/sccache' }}
    - uses: mozilla-actions/sccache-action@v0.0.11
    - shell: bash
      run: |
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
        echo SCCACHE_CACHE_SIZE=1G >> "$GITHUB_ENV"
        echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV"
    # Only main saves (once per dependency set); everything else restores the closest match.
    - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.head_ref == 'ci/sccache'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-${{ inputs.key }}-${{ hashFiles('Cargo.lock', 'vendor/**') }}
        restore-keys: sccache-${{ inputs.key }}-
    - if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && github.head_ref != 'ci/sccache'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-${{ inputs.key }}-${{ hashFiles('Cargo.lock', 'vendor/**') }}
        restore-keys: sccache-${{ inputs.key }}-
