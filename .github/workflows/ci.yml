name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action, explicit nightly toolchain
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  # One job per OS: lint, then test, then (on main) a release build, sharing one cache.
  # Clippy only sees code compiled for its OS, so each platform lints its own cfg'd code.
  check:
    name: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install dependency auditor
        if: runner.os == 'Linux'
        run: cargo install cargo-machete --version 0.9.1 --locked
      - name: Lint (clippy, docs, dependencies, banned patterns)
        if: runner.os == 'Linux'
        run: scripts/lint.sh clippy docs deps ban
      - name: Lint (clippy)
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Workspace tests only; ignored tests are manual benchmarks and a native-desktop tray test.
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Release build
        if: github.event_name != 'pull_request'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p turntable --target "$RUST_TARGET"

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check conventional commit title for squash merge
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r"(?:feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(?:\([^()\r\n]+\))?!?: [^\s].*"
          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              sys.exit("PR title must be a conventional commit, e.g. feat(player): add shuffle")
          PY
