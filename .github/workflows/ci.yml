name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its stale run; pushes to main queue instead, so every main
# commit finishes its checks (and a follow-up push never cancels a release candidate).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

defaults:
  run:
    shell: bash

jobs:
  # Skips the Rust jobs when a change only touches prose (Markdown, license texts, issue
  # templates). Anything else, including scripts, manifests, vendored crates and workflows,
  # runs the full pipeline. Manual runs always do.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            push) base=$PUSH_BEFORE ;;
            pull_request) base=$PR_BASE ;;
            merge_group) base=$QUEUE_BASE ;;
            *) base= ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$base" HEAD | grep -Ev '(\.md$|^LICENSE|^THIRD_PARTY_NOTICES$|^\.github/ISSUE_TEMPLATE/|^\.github/CODEOWNERS$)' || true)
          echo "Code changes:"; echo "${code:-none}"
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable action, explicit nightly toolchain
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  lint:
    name: lint (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-lint-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install dependency auditor
        if: runner.os == 'Linux'
        run: cargo install cargo-machete --version 0.9.1 --locked
      - name: Clippy, documentation, dependencies, banned patterns
        if: runner.os == 'Linux'
        run: scripts/lint.sh clippy docs deps ban
      - name: Platform clippy
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Cargo runs workspace tests, not dependency/backend tests needing a native desktop.
      # Keep the default ignored-test behavior for manual benchmarks and the native tray test.
      - run: cargo test --locked --workspace --all-targets

  build:
    name: build (${{ matrix.os }})
    # Release builds are slow; only spend them once lint and tests pass everywhere.
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-build-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Release build including vendored path patches
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p turntable --target "$RUST_TARGET"

  # The one required check. Passes when every job succeeded, or was skipped because the
  # change was prose-only; skipped matrix jobs can't satisfy required checks themselves.
  ci:
    name: ci
    if: always()
    needs: [changes, fmt, lint, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check conventional commit title for squash merge
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r"(?:feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(?:\([^()\r\n]+\))?!?: [^\s].*"
          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              sys.exit("PR title must be a conventional commit, e.g. feat(player): add shuffle")
          PY
