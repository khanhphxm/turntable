name: Release

# Private repository: manual runs only. After going public, add
# push: { tags: ['v*'] } beneath `on` to enable automatic tagged releases.
on: workflow_dispatch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "turntable"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-14
    env:
      TURNTABLE_VERSION: ${{ needs.version.outputs.version }}
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p turntable --target aarch64-apple-darwin
      - name: Import Developer ID (optional)
        if: env.DEVELOPER_ID_P12 != '' && env.DEVELOPER_ID_P12_PASSWORD != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/turntable-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/turntable-id.p12"
          security import "$RUNNER_TEMP/turntable-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/turntable-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | python3 -c 'import re,sys; print(next(iter(re.findall(r"\"(Developer ID Application:[^\"]+)\"", sys.stdin.read())), ""))')
          test -n "$identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Bundle (ad-hoc without Developer ID)
        run: packaging/bundle-macos.sh target/aarch64-apple-darwin/release/turntable
      - name: Notarize and staple (optional)
        if: env.CODESIGN_IDENTITY != '' && env.NOTARY_KEY != '' && env.NOTARY_KEY_ID != '' && env.NOTARY_ISSUER_ID != ''
        shell: bash
        run: |
          key="$RUNNER_TEMP/turntable-notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent dist/turntable.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple dist/turntable.app
          xcrun stapler validate dist/turntable.app
          spctl --assess --type execute --verbose dist/turntable.app
      - name: Package
        run: |
          plutil -lint dist/turntable.app/Contents/Info.plist
          codesign --verify --strict dist/turntable.app
          codesign -dv dist/turntable.app
          ditto -c -k --keepParent dist/turntable.app "dist/turntable-$TURNTABLE_VERSION-macos-arm64.zip"
      - name: Remove signing keychain
        if: always() && env.DEVELOPER_ID_P12 != '' && env.DEVELOPER_ID_P12_PASSWORD != ''
        run: |
          if [ -f "$RUNNER_TEMP/turntable-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/turntable-signing.keychain-db"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      TURNTABLE_VERSION: ${{ needs.version.outputs.version }}
      TURNTABLE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake ninja-build pkg-config \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-xkb-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxrender-dev \
            libxfixes-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p turntable --target ${{ matrix.target }}
      - run: packaging/bundle-linux.sh target/${{ matrix.target }}/release/turntable
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    env:
      TURNTABLE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p turntable --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: packaging/bundle-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/turntable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TURNTABLE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
          gh release create "v$TURNTABLE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "turntable $TURNTABLE_VERSION" --generate-notes
