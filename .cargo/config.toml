# Sign macOS executables before `cargo run` / `cargo test` for stable Keychain access.
# The runner prefers a Developer ID identity when one is available.
[target.aarch64-apple-darwin]
runner = "scripts/run-signed.sh"

[target.x86_64-apple-darwin]
runner = "scripts/run-signed.sh"


[env]
# jemalloc (the app's allocator, see crates/turntable/src/main.rs): one arena, no thread caches.
# Purge freed pages immediately: decay is allocation-driven, so a one-second decay can leave
# the last frame's freed pages dirty indefinitely once the app parks. This adds no idle thread
# or timer. A 30-second idle macOS A/B on compact GPUI arenas saved another 0.73 MiB in
# App-Specific Tag 15 and physical footprint; cache sizes and rendering are unchanged.
# Use one-page slabs where an object fits, otherwise the minimum pages per object.
# The throughput-oriented defaults strand larger, partly occupied slabs in the idle heap;
# native macOS A/B saved about 0.5 MiB of Tag 15 without an idle thread or timer.
JEMALLOC_SYS_WITH_MALLOC_CONF = "narenas:1,tcache:false,dirty_decay_ms:0,muzzy_decay_ms:0,slab_sizes:1-65536:1"
